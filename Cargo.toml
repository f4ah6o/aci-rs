[package]
name = "aci"
version = "2026.3.2"
edition = "2024"
rust-version = "1.99"
description = "Mount APIs as CLIs with raw HTTP and OpenAPI-backed commands"
license = "MIT"
repository = "https://github.com/f4ah6o/aci-rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
openapiv3 = "2.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
